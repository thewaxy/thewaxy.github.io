<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excuse Button</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #292929, #111 55%);
            color: white;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 999px;
            background: #292929;
            border: 1px solid #444;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 9vw, 80px);
            letter-spacing: -4px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 17px;
            margin-bottom: 45px;
        }

        .excuse-box {
            min-height: 130px;
            padding: 30px;
            border-radius: 24px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        #excuse {
            font-size: clamp(20px, 4vw, 30px);
            font-weight: 600;
            line-height: 1.3;
        }

        button {
            width: 100%;
            max-width: 360px;
            padding: 20px 30px;
            border: none;
            border-radius: 18px;
            background: white;
            color: #111;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s ease;
            box-shadow: 0 10px 40px rgba(255,255,255,0.08);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(255,255,255,0.15);
        }

        button:active {
            transform: scale(0.96);
        }

        .copy {
            margin-top: 12px;
            background: transparent;
            color: #777;
            box-shadow: none;
            font-size: 14px;
            padding: 10px;
        }

        .copy:hover {
            color: white;
            box-shadow: none;
        }

        .pop {
            animation: pop 0.25s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.96);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        footer {
            margin-top: 30px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="badge">100% scientifically questionable</div>

    <h1>Excuse Button</h1>

    <p class="subtitle">
        Something went wrong. We don't know what.
    </p>

    <div class="excuse-box">
        <div id="excuse">
            Click the button. Your reputation depends on it.
        </div>
    </div>

    <button onclick="generateExcuse()">
        GENERATE EXCUSE
    </button>

    <button class="copy" onclick="copyExcuse()">
        Copy excuse
    </button>

    <footer>
        Use responsibly. Or don't.
    </footer>

</div>

<script>

const excuses = [

    // Teknoloji
    "The electricity went out at the worst possible moment.",
    "My Wi-Fi suddenly stopped working.",
    "My phone died and I couldn't charge it.",
    "My computer decided to update itself.",
    "The internet was being extremely weird today.",
    "My device crashed before I could finish.",
    "Something went wrong with my charger.",
    "My computer froze and took everything with it.",
    "The power went out and I lost everything.",
    "My Wi-Fi exploded emotionally.",

    // Ev / aile
    "Something unexpected happened at home.",
    "There was a family situation I had to deal with.",
    "My parents needed my help with something.",
    "I had to take care of something at home.",
    "There was a small emergency at home.",
    "I completely lost track of time because of something at home.",

    // Ulaşım
    "Traffic was much worse than I expected.",
    "My ride was delayed.",
    "Public transportation decided not to cooperate today.",
    "I got stuck on the way here.",
    "There was an unexpected delay on the road.",
    "Something happened with my transportation.",

    // Genel
    "I had a really unexpected problem come up.",
    "Something completely unexpected happened.",
    "I thought I had more time than I actually did.",
    "I was dealing with something I didn't plan for.",
    "Things got a little more complicated than expected.",
    "I genuinely planned to do it earlier.",
    "I completely underestimated how long it would take.",
    "I had everything under control until I didn't.",
    "My entire schedule fell apart.",
    "Today just did not go according to plan.",

    // Aşırı absürt
    "A chicken blocked the road.",
    "My alarm clock betrayed me.",
    "I was ready, but reality wasn't.",
    "My brain temporarily disconnected from the server.",
    "I experienced an unexpected system failure.",
    "I was physically present, but mentally still loading.",
    "The universe had other plans.",
    "I blame the laws of physics.",
    "There was an incident involving a suspicious pigeon.",
    "I would explain, but honestly I'm still trying to understand it.",

    // Hafif resmi
    "I apologize for the inconvenience. An unforeseen issue occurred.",
    "Unfortunately, an unexpected technical issue prevented me from completing it.",
    "I encountered an unforeseen problem and wasn't able to finish on time.",
    "There was an unexpected circumstance that required my attention.",
    "I experienced an issue that was outside of my control."

];

let lastExcuse = "";

function generateExcuse() {

    let excuse;

    do {
        excuse = excuses[Math.floor(Math.random() * excuses.length)];
    } while (excuse === lastExcuse && excuses.length > 1);

    lastExcuse = excuse;

    const element = document.getElementById("excuse");

    element.classList.remove("pop");

    void element.offsetWidth;

    element.innerText = excuse;
    element.classList.add("pop");
}

function copyExcuse() {

    if (!lastExcuse) {
        generateExcuse();
    }

    navigator.clipboard.writeText(lastExcuse);

    const button = document.querySelector(".copy");
    const oldText = button.innerText;

    button.innerText = "Copied ✓";

    setTimeout(() => {
        button.innerText = oldText;
    }, 1200);
}

</script>

</body>
</html>
